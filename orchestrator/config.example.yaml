# Loop engineering orchestrator — copy to config.yaml and run `python -m orchestrator setup`
# Generated ntfy_topic must be unguessable; do not commit production topics.

test_agent_models:
  - composer-2.5
  - claude-sonnet-4-6
fix_agent_models:
  - grok-4.5
  - claude-opus-4-8
free_lane_cap: 2
max_fix_attempts: 6
agent_timeout_seconds: 600
exhaustion_backoff_seconds: 1800
exhaustion_backoff_cap_seconds: 14400
grounding_similarity_threshold: 0.75  # unvalidated placeholder
tier3_process_ids: []
ntfy_topic: "pith-loop-REPLACE_AT_SETUP"
fixture_library_path: fixtures
inventory_path: audit/process-inventory-20260717.md
agent_command_template: "agent -p --force --model {model}"
agent_bin: agent
exhaustion_matchers:
  - rate limit
  - quota
  - insufficient
  - credit
  - usage limit
test_allowlist_prefix: cursor-tests/loop-engineering/
